<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="智慧金融分析平台 — 行情、舆情、量化、交易工作台" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>智慧金融 · 工作台</title>
    <script>
      (function () {
        var key = 'sfp-active-theme'
        var theme = 'glass-dark'
        try {
          var stored = window.localStorage.getItem(key)
          if (stored === 'glass-light' || stored === 'glass-dark') theme = stored
        } catch (e) { /* ignore */ }
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme === 'glass-light' ? 'light' : 'dark'
        document.documentElement.classList.toggle('dark', theme !== 'glass-light')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
