# Emergency Python trade HTTP rollback (not default slim).
# Requires --profile legacy-python (or this overlay's !override) so sentiment-trade starts.
#
#   sudo docker compose \
#     -f docker-compose.sentiment.yml \
#     -f docker-compose.sentiment.slim.yml \
#     -f docker-compose.sentiment.trade-python-fallback.yml \
#     --profile legacy-python \
#     up -d --build sentiment-trade sentiment-trade-api sentiment-frontend
#
# Nginx catch-all can also be pointed at sentiment-trade via
# ruoyi-fastapi-frontend/bin/nginx.dockersentiment.slim.python-trade.conf (not shipped by default).

services:
  sentiment-trade:
    profiles: [legacy-python]

  sentiment-trade-api:
    environment:
      TRADE_HTTP_FALLBACK_URL: http://sentiment-trade:9099
    depends_on:
      sentiment-trade:
        condition: service_healthy

  sentiment-frontend:
    depends_on:
      sentiment-trade:
        condition: service_healthy
