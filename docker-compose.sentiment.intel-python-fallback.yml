# Python intel rollback: route /sentiment/ + /ai/ + /open/ back to sentiment-intel; stop Go sfp-intel.
#
#   sudo docker compose \
#     -f docker-compose.sentiment.yml \
#     -f docker-compose.sentiment.slim.yml \
#     -f docker-compose.sentiment.intel-python-fallback.yml \
#     --profile intel-python-fallback \
#     up -d --no-deps sentiment-intel sentiment-frontend
#   sudo docker compose … stop sfp-intel
#
# Requires nginx swap to nginx.dockersentiment.slim.python-intel.conf (mounted below).

services:
  sfp-intel:
    profiles: [intel-go-off]

  sentiment-intel:
    profiles: [intel-python-fallback]

  sentiment-frontend:
    volumes:
      - ./ruoyi-fastapi-frontend/bin/nginx.dockersentiment.slim.python-intel.conf:/etc/nginx/conf.d/default.conf
