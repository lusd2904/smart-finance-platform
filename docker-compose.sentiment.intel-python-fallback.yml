# Emergency Python intel rollback (not default slim).
# Requires --profile legacy-python so sentiment-intel is created.
#
#   sudo docker compose \
#     -f docker-compose.sentiment.yml \
#     -f docker-compose.sentiment.slim.yml \
#     -f docker-compose.sentiment.intel-python-fallback.yml \
#     --profile legacy-python \
#     up -d --no-deps sentiment-intel sentiment-frontend
#   sudo docker compose … stop sfp-intel
#
# Swaps nginx to nginx.dockersentiment.slim.python-intel.conf (mounted below).
# Leave sfp-intel in the default project so frontend depends_on stays valid;
# stop it manually after the nginx swap.

services:
  sentiment-intel:
    profiles: [legacy-python]

  sentiment-frontend:
    volumes:
      - ./ruoyi-fastapi-frontend/bin/nginx.dockersentiment.slim.python-intel.conf:/etc/nginx/conf.d/default.conf
