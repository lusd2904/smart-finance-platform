# Slim overlay for 15–16 GiB hosts (~4–5 GiB steady RSS, no swap).
#
# Go-only runtime. Python fat containers (sentiment-backend / sentiment-data / sentiment-intel /
# sentiment-trade / sentiment-jobs) have been removed from the repo.
# InfluxDB has been removed (MySQL is the sole source of truth for kline & daily bars).

services:
  sentiment-market-read:
    mem_limit: 320m
    cpus: 0.5
    depends_on:
      sentiment-mysql:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy

  sfp-intel:
    mem_limit: 320m
    cpus: 0.5

  sentiment-data-api:
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      sentiment-mysql:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy

  sfp-backup:
    profiles: [full-backup]

  sfp-backend:
    environment:
      INTEL_JOBS_URL: http://sfp-intel:8080
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:19099:9099"

  sentiment-trade-api:
    mem_limit: 320m
    cpus: 0.35
    depends_on: !override
      sentiment-mysql:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy

  sfp-scheduler:
    mem_limit: 64m
    cpus: 0.25

  sfp-market-worker:
    mem_limit: 320m
    cpus: 0.5

  sfp-quant-worker:
    mem_limit: 224m
    cpus: 0.25

  sfp-notify-worker:
    mem_limit: 224m
    cpus: 0.25

  sentiment-mysql:
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --skip-character-set-client-handshake=1
      --max-connections=80
      --binlog-expire-logs-seconds=259200
      --innodb-buffer-pool-size=192M
      --innodb-log-buffer-size=8M
      --table-open-cache=256
    mem_limit: 512m
    volumes: !override
      - ${SFP_DATA_ROOT:-/workspace/sfp-data}/mysql:/var/lib/mysql
      - ./sql/ruoyi-fastapi.sql:/docker-entrypoint-initdb.d/01-ruoyi-fastapi.sql
      - ./sql/sentiment-menu.sql:/docker-entrypoint-initdb.d/02-sentiment-menu.sql
      - ./sql/market-menu.sql:/docker-entrypoint-initdb.d/03-market-menu.sql
      - ./sql/quant-menu.sql:/docker-entrypoint-initdb.d/04-quant-menu.sql
      - ./sql/auto-trade.sql:/docker-entrypoint-initdb.d/05-auto-trade.sql
      - ./sql/full-feature-menu.sql:/docker-entrypoint-initdb.d/06-full-feature-menu.sql
      - ./sql/deep-feature-menu.sql:/docker-entrypoint-initdb.d/07-deep-feature-menu.sql
      - ./sql/risk-event-workflow.sql:/docker-entrypoint-initdb.d/09-risk-event-workflow.sql
      - ./sql/quant-phase2-snapshots.sql:/docker-entrypoint-initdb.d/10-quant-phase2-snapshots.sql
      - ./sql/quant-factor-qc.sql:/docker-entrypoint-initdb.d/11-quant-factor-qc.sql
      - ./sql/market-watchlist.sql:/docker-entrypoint-initdb.d/12-market-watchlist.sql
      - ./sql/web-polish.sql:/docker-entrypoint-initdb.d/13-web-polish.sql
      - ./sql/analysis-scheduler.sql:/docker-entrypoint-initdb.d/14-analysis-scheduler.sql
      - ./sql/quant-longbridge-user.sql:/docker-entrypoint-initdb.d/15-quant-longbridge-user.sql
      - ./sql/ai-requirement-board.sql:/docker-entrypoint-initdb.d/16-ai-requirement-board.sql
      - ./sql/ai-req-bots.sql:/docker-entrypoint-initdb.d/17-ai-req-bots.sql
      - ./sql/quant-daily-list.sql:/docker-entrypoint-initdb.d/18-quant-daily-list.sql
      - ./sql/plat-feishu-push.sql:/docker-entrypoint-initdb.d/19-plat-feishu-push.sql

  ruoyi-redis:
    mem_limit: 128m
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?请在 .env 中设置 REDIS_PASSWORD}",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes: !override
      - ${SFP_DATA_ROOT:-/workspace/sfp-data}/redis:/data

  sentiment-frontend:
    mem_limit: 64m
    volumes:
      - ./ruoyi-fastapi-frontend/bin/nginx.dockersentiment.slim.conf:/etc/nginx/conf.d/default.conf
    depends_on: !override
      sfp-backend:
        condition: service_healthy
      sentiment-trade-api:
        condition: service_healthy
      sentiment-data-api:
        condition: service_healthy
      sfp-intel:
        condition: service_healthy
      sentiment-market-read:
        condition: service_healthy
