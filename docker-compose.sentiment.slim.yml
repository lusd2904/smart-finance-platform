# Slim overlay for 15–16 GiB hosts (~4–5 GiB steady RSS after Influx healthy, no swap).
#
# Influx COLD_OPEN (18G restore, ~2992 shards): mem_limit ≥12g / GOMEMLIMIT 10GiB (integer only).
# cursor-1 SUCCESS: service-level binds → $SFP_DATA_ROOT/influx, mem_limit 12g, GOMEMLIMIT 10GiB,
# 4G loop swap, peak ~11.7GiB → healthy. 6g/8g/10g without swap OOM. vfs: service-level binds required.
# Do NOT drop to influx-steady (3g) immediately after cold open — leave headroom until full-stack stable.
# Optional later: docker-compose.sentiment.slim.influx-steady.yml → 3g / 2560MiB
#
# Go-only runtime. Python fat containers (sentiment-backend / sentiment-data / sentiment-intel /
# sentiment-trade / sentiment-jobs) have been removed from the repo. Rollback is git history,
# see docs/PYTHON-REMOVED.md.
#
# cursor-1 production (ONLY this overlay after merge — see docs/SLIM-POST-MERGE.md):
#   cd /workspace/sfp-slim-64
#   source scripts/docker_host.sh
#   export SFP_DATA_ROOT=/workspace/sfp-data
#   sudo docker compose -f docker-compose.sentiment.yml -f docker-compose.sentiment.slim.yml up -d --build
#   # daily roll: bash scripts/deploy_and_verify_slim.sh
#
# Data bind (default SFP_DATA_ROOT=/workspace/sfp-data). cursor-1 restored layout:
#
#   Host path                          → Container mount
#   $SFP_DATA_ROOT/mysql               → /var/lib/mysql
#   $SFP_DATA_ROOT/redis               → /data
#   $SFP_DATA_ROOT/influx              → /var/lib/influxdb2  (influxd.bolt, engine/, ~18G)
#   $SFP_DATA_ROOT/influx-config       → /etc/influxdb2
#
#   mkdir -p "$SFP_DATA_ROOT"/{mysql,redis,influx,influx-config}
#   bash scripts/sfp_data_init.sh
#
#   ⚠️  Do NOT use influx/data or influx/config — those paths hide the restored volume.
#
# cursor-1 Docker uses storage driver **vfs** — named volumes with driver_opts bind
# do NOT mount (empty _data). Slim overlay uses **service-level binds** below.
#
# MySQL shard not uploaded yet (Influx-only heat/kline reads):
#   bash scripts/up_slim_influx_phase.sh
#   (+ docker-compose.sentiment.slim.influx-phase.yml)
#
# Verify (Influx healthy, idle ~5 min):
#   docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}'

services:
  sentiment-market-read:
    mem_limit: 320m
    cpus: 0.5
    depends_on:
      sentiment-mysql:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
      sentiment-influxdb:
        condition: service_healthy

  sfp-intel:
    mem_limit: 320m
    cpus: 0.5

  sentiment-data-api:
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      sentiment-mysql:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
      sentiment-influxdb:
        condition: service_healthy

  sfp-backup:
    profiles: [full-backup]

  sfp-backend:
    environment:
      INTEL_JOBS_URL: http://sfp-intel:8080
    mem_limit: 256m
    cpus: 0.5
    ports:
      - "127.0.0.1:19099:9099"

  sentiment-trade-api:
    mem_limit: 320m
    cpus: 0.35
    depends_on: !override
      sentiment-mysql:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
      sentiment-influxdb:
        condition: service_healthy

  sfp-scheduler:
    mem_limit: 64m
    cpus: 0.25

  sfp-market-worker:
    mem_limit: 320m
    cpus: 0.5

  sfp-quant-worker:
    mem_limit: 224m
    cpus: 0.25

  sfp-notify-worker:
    mem_limit: 224m
    cpus: 0.25

  sentiment-influxdb:
    environment:
      # COLD_OPEN: ≥12g / 10GiB for ~2992 shards (18G restore). cursor-1: 12g + 4G loop swap,
      # peak ~11.7GiB → healthy. vfs service-level binds required. No decimal GOMEMLIMIT.
      # Do NOT apply influx-steady (3g) right after cold open.
      GOMEMLIMIT: "10GiB"
      INFLUXD_STORAGE_CACHE_MAX_MEMORY_SIZE: "134217728"
      INFLUXD_STORAGE_CACHE_SNAPSHOT_MEMORY_SIZE: "16777216"
      INFLUXD_STORAGE_MAX_CONCURRENT_COMPACTIONS: "1"
      INFLUXD_STORAGE_SERIES_ID_SET_CACHE_SIZE: "0"
      INFLUXD_QUERY_CONCURRENCY: "1"
      INFLUXD_QUERY_QUEUE_SIZE: "2"
    mem_limit: 12g
    cpus: 1.0
    volumes: !override
      - ${SFP_DATA_ROOT:-/workspace/sfp-data}/influx:/var/lib/influxdb2
      - ${SFP_DATA_ROOT:-/workspace/sfp-data}/influx-config:/etc/influxdb2

  sentiment-mysql:
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --skip-character-set-client-handshake=1
      --max-connections=80
      --innodb-buffer-pool-size=192M
      --innodb-log-buffer-size=8M
      --table-open-cache=256
    mem_limit: 512m
    volumes: !override
      - ${SFP_DATA_ROOT:-/workspace/sfp-data}/mysql:/var/lib/mysql
      - ./sql/ruoyi-fastapi.sql:/docker-entrypoint-initdb.d/01-ruoyi-fastapi.sql
      - ./sql/sentiment-menu.sql:/docker-entrypoint-initdb.d/02-sentiment-menu.sql
      - ./sql/market-menu.sql:/docker-entrypoint-initdb.d/03-market-menu.sql
      - ./sql/quant-menu.sql:/docker-entrypoint-initdb.d/04-quant-menu.sql
      - ./sql/auto-trade.sql:/docker-entrypoint-initdb.d/05-auto-trade.sql
      - ./sql/full-feature-menu.sql:/docker-entrypoint-initdb.d/06-full-feature-menu.sql
      - ./sql/deep-feature-menu.sql:/docker-entrypoint-initdb.d/07-deep-feature-menu.sql
      - ./sql/risk-event-workflow.sql:/docker-entrypoint-initdb.d/09-risk-event-workflow.sql
      - ./sql/quant-phase2-snapshots.sql:/docker-entrypoint-initdb.d/10-quant-phase2-snapshots.sql
      - ./sql/quant-factor-qc.sql:/docker-entrypoint-initdb.d/11-quant-factor-qc.sql
      - ./sql/market-watchlist.sql:/docker-entrypoint-initdb.d/12-market-watchlist.sql
      - ./sql/web-polish.sql:/docker-entrypoint-initdb.d/13-web-polish.sql
      - ./sql/analysis-scheduler.sql:/docker-entrypoint-initdb.d/14-analysis-scheduler.sql
      - ./sql/quant-longbridge-user.sql:/docker-entrypoint-initdb.d/15-quant-longbridge-user.sql
      - ./sql/ai-requirement-board.sql:/docker-entrypoint-initdb.d/16-ai-requirement-board.sql
      - ./sql/ai-req-bots.sql:/docker-entrypoint-initdb.d/17-ai-req-bots.sql
      - ./sql/quant-daily-list.sql:/docker-entrypoint-initdb.d/18-quant-daily-list.sql
      - ./sql/plat-feishu-push.sql:/docker-entrypoint-initdb.d/19-plat-feishu-push.sql

  ruoyi-redis:
    mem_limit: 128m
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:-}",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes: !override
      - ${SFP_DATA_ROOT:-/workspace/sfp-data}/redis:/data

  sentiment-frontend:
    mem_limit: 64m
    volumes:
      - ./ruoyi-fastapi-frontend/bin/nginx.dockersentiment.slim.conf:/etc/nginx/conf.d/default.conf
    depends_on: !override
      sfp-backend:
        condition: service_healthy
      sentiment-trade-api:
        condition: service_healthy
      sentiment-data-api:
        condition: service_healthy
      sfp-intel:
        condition: service_healthy
      sentiment-market-read:
        condition: service_healthy
