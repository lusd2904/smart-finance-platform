# Slim overlay for 15–16 GiB hosts (~4–5 GiB steady RSS, **peak stack < 5.5 GiB**, no swap).
#
# cursor-1 production (ONLY this overlay after merge — see docs/SLIM-POST-MERGE.md):
#   source scripts/docker_host.sh
#   sudo docker compose -f docker-compose.sentiment.yml -f docker-compose.sentiment.slim.yml up -d --build
#
# Data bind (default SFP_DATA_ROOT=/workspace/sfp-data):
#   mysql/ redis/ influx/data/ influx/config/
#
# Full split stack (large dev machines):
#   docker compose -f docker-compose.sentiment.yml --profile full-split up -d --build
#
# Verify (Influx healthy, idle ~5 min):
#   docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}'

x-slim-pool-env: &slim-pool-env
  DB_POOL_SIZE: "4"
  DB_MAX_OVERFLOW: "2"

x-slim-api-health: &slim-api-health
  test:
    [
      "CMD",
      "python",
      "-c",
      "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/health', timeout=3)",
    ]
  interval: 15s
  timeout: 5s
  retries: 8
  start_period: 25s

services:
  # --- disable full-split API / worker containers when slim overlay is active ---
  sentiment-market:
    profiles: [full-split]
  sentiment-quant:
    profiles: [full-split]
  sentiment-news:
    profiles: [full-split]
  sentiment-ai:
    profiles: [full-split]
  sentiment-jobs-market:
    profiles: [full-split]
  sentiment-jobs-quant:
    profiles: [full-split]
  sentiment-jobs-llm:
    profiles: [full-split]

  # Backup loops on docker.sock; on tight RAM hosts run scripts/backup_data.sh via cron instead.
  sfp-backup:
    profiles: [full-backup]

  # --- merged API: market + quant (Influx reads, WS) ---
  sentiment-data:
    build:
      context: ./ruoyi-fastapi-backend
      dockerfile: Dockerfile.sentiment
    image: sentiment-backend:latest
    container_name: sentiment-data
    volumes:
      - ./ruoyi-fastapi-backend/.env.dockersentiment:/app/.env.dockersentiment:ro
    networks:
      - sentiment-network
    restart: unless-stopped
    environment:
      <<: *slim-pool-env
      APP_ROLE: api
      APP_MODULE: data
      APP_JOB_GROUP: none
      APP_NAME: "Data API (market+quant)"
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      ruoyi-mysql:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
      sentiment-influxdb:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    healthcheck: *slim-api-health

  # --- merged API: sentiment + ai (舆情 / 选股 / open) ---
  sentiment-intel:
    build:
      context: ./ruoyi-fastapi-backend
      dockerfile: Dockerfile.sentiment
    image: sentiment-backend:latest
    container_name: sentiment-intel
    volumes:
      - ./ruoyi-fastapi-backend/.env.dockersentiment:/app/.env.dockersentiment:ro
    networks:
      - sentiment-network
    restart: unless-stopped
    environment:
      <<: *slim-pool-env
      APP_ROLE: api
      APP_MODULE: intel
      APP_JOB_GROUP: none
      APP_NAME: "Intel API (sentiment+ai)"
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      ruoyi-mysql:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    healthcheck: *slim-api-health

  sentiment-backend:
    environment:
      <<: *slim-pool-env
    mem_limit: 384m

  sentiment-trade:
    environment:
      <<: *slim-pool-env
    mem_limit: 512m

  sentiment-jobs:
    environment:
      <<: *slim-pool-env
      APP_ROLE: scheduler
      APP_JOB_GROUP: all
      APP_NAME: "Sentiment Jobs (slim)"
    mem_limit: 1024m
    cpus: 1.0

  sentiment-influxdb:
    environment:
      # 18G+ on-disk shards: steady RSS ~1.2–1.6 GiB with cache caps. TSI cold-open may
      # spike; if OOM on first boot, temporarily raise mem_limit to 2.5g for one start.
      GOMEMLIMIT: "1400MiB"
      INFLUXD_STORAGE_CACHE_MAX_MEMORY_SIZE: "134217728"
      INFLUXD_STORAGE_CACHE_SNAPSHOT_MEMORY_SIZE: "16777216"
      INFLUXD_STORAGE_MAX_CONCURRENT_COMPACTIONS: "1"
      INFLUXD_STORAGE_SERIES_ID_SET_CACHE_SIZE: "0"
      INFLUXD_QUERY_CONCURRENCY: "1"
      INFLUXD_QUERY_QUEUE_SIZE: "2"
    mem_limit: 1800m
    cpus: 1.0

  ruoyi-mysql:
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --skip-character-set-client-handshake=1
      --max-connections=80
      --innodb-buffer-pool-size=192M
      --innodb-log-buffer-size=8M
      --table-open-cache=256
    mem_limit: 512m

  ruoyi-redis:
    mem_limit: 128m
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:-}",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]

  sentiment-frontend:
    mem_limit: 64m
    volumes:
      - ./ruoyi-fastapi-frontend/bin/nginx.dockersentiment.slim.conf:/etc/nginx/conf.d/default.conf
    depends_on: !override
      sentiment-backend:
        condition: service_healthy
      sentiment-trade:
        condition: service_healthy
      sentiment-data:
        condition: service_healthy
      sentiment-intel:
        condition: service_healthy

volumes:
  sentiment-mysql-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SFP_DATA_ROOT:-/workspace/sfp-data}/mysql
  sentiment-redis-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SFP_DATA_ROOT:-/workspace/sfp-data}/redis
  sentiment-influxdb-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SFP_DATA_ROOT:-/workspace/sfp-data}/influx/data
  sentiment-influxdb-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${SFP_DATA_ROOT:-/workspace/sfp-data}/influx/config
