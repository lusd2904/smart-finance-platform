# Slim overlay for 15–16 GiB hosts (~4–5 GiB steady RSS after Influx healthy, no swap).
#
# Influx COLD_OPEN (18G restore, ~3k shards): mem_limit 8g / GOMEMLIMIT 7000MiB.
# GOMEMLIMIT must be integer MiB or GiB — no decimals (5.2GiB fatals).
# cursor-1: 6g still exit 137 at ~5.8GiB RSS. Pause grok2api during first open on 16G hosts.
# After healthy: -f docker-compose.sentiment.slim.influx-steady.yml  → 3g / 2560MiB
#
# cursor-1 production (ONLY this overlay after merge — see docs/SLIM-POST-MERGE.md):
#   source scripts/docker_host.sh
#   sudo docker compose -f docker-compose.sentiment.yml -f docker-compose.sentiment.slim.yml up -d --build
#
# Data bind (default SFP_DATA_ROOT=/workspace/sfp-data). cursor-1 restored layout:
#
#   Host path                          → Container mount
#   $SFP_DATA_ROOT/mysql               → /var/lib/mysql
#   $SFP_DATA_ROOT/redis               → /data
#   $SFP_DATA_ROOT/influx              → /var/lib/influxdb2  (influxd.bolt, engine/, ~18G)
#   $SFP_DATA_ROOT/influx-config       → /etc/influxdb2
#
#   mkdir -p "$SFP_DATA_ROOT"/{mysql,redis,influx,influx-config}
#   bash scripts/sfp_data_init.sh
#
#   ⚠️  Do NOT use influx/data or influx/config — those paths hide the restored volume.
#
# cursor-1 Docker uses storage driver **vfs** — named volumes with driver_opts bind
# do NOT mount (empty _data). Slim overlay uses **service-level binds** below.
#
# MySQL shard not uploaded yet (Influx-only heat/kline reads):
#   bash scripts/up_slim_influx_phase.sh
#   (+ docker-compose.sentiment.slim.influx-phase.yml)
#
# Full split stack (large dev machines):
#   docker compose -f docker-compose.sentiment.yml --profile full-split up -d --build
#
# Verify (Influx healthy, idle ~5 min):
#   docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}'

x-slim-pool-env: &slim-pool-env
  DB_POOL_SIZE: "4"
  DB_MAX_OVERFLOW: "2"

x-slim-api-health: &slim-api-health
  test:
    [
      "CMD",
      "python",
      "-c",
      "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/health', timeout=3)",
    ]
  interval: 15s
  timeout: 5s
  retries: 8
  start_period: 25s

services:
  # --- disable full-split API / worker containers when slim overlay is active ---
  sentiment-market:
    profiles: [full-split]
  sentiment-quant:
    profiles: [full-split]
  sentiment-news:
    profiles: [full-split]
  sentiment-ai:
    profiles: [full-split]
  sentiment-jobs-market:
    profiles: [full-split]
  sentiment-jobs-quant:
    profiles: [full-split]
  sentiment-jobs-llm:
    profiles: [full-split]

  # Backup loops on docker.sock; on tight RAM hosts run scripts/backup_data.sh via cron instead.
  sfp-backup:
    profiles: [full-backup]

  # --- merged API: market + quant (Influx reads, WS) ---
  sentiment-data:
    build:
      context: ./ruoyi-fastapi-backend
      dockerfile: Dockerfile.sentiment
    image: sentiment-backend:latest
    container_name: sentiment-data
    volumes:
      - ./ruoyi-fastapi-backend/.env.dockersentiment:/app/.env.dockersentiment:ro
    networks:
      - sentiment-network
    restart: unless-stopped
    environment:
      <<: *slim-pool-env
      APP_ROLE: api
      APP_MODULE: data
      APP_JOB_GROUP: none
      APP_NAME: "Data API (market+quant)"
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      ruoyi-mysql:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
      sentiment-influxdb:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    healthcheck: *slim-api-health

  # --- merged API: sentiment + ai (舆情 / 选股 / open) ---
  sentiment-intel:
    build:
      context: ./ruoyi-fastapi-backend
      dockerfile: Dockerfile.sentiment
    image: sentiment-backend:latest
    container_name: sentiment-intel
    volumes:
      - ./ruoyi-fastapi-backend/.env.dockersentiment:/app/.env.dockersentiment:ro
    networks:
      - sentiment-network
    restart: unless-stopped
    environment:
      <<: *slim-pool-env
      APP_ROLE: api
      APP_MODULE: intel
      APP_JOB_GROUP: none
      APP_NAME: "Intel API (sentiment+ai)"
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      ruoyi-mysql:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
    mem_limit: 512m
    cpus: 1.0
    healthcheck: *slim-api-health

  sentiment-backend:
    environment:
      <<: *slim-pool-env
    mem_limit: 384m

  sentiment-trade:
    environment:
      <<: *slim-pool-env
    mem_limit: 512m

  sentiment-jobs:
    environment:
      <<: *slim-pool-env
      APP_ROLE: scheduler
      APP_JOB_GROUP: all
      APP_NAME: "Sentiment Jobs (slim)"
    mem_limit: 1024m
    cpus: 1.0

  sentiment-influxdb:
    environment:
      # COLD_OPEN: 8g / 7000MiB for ~3k shards (6g→MEMCG OOM at ~5.8GiB RSS on cursor-1).
      # Pause co-located stacks (grok2api) on 16G hosts before first open. No decimal GOMEMLIMIT.
      # After healthy: docker-compose.sentiment.slim.influx-steady.yml (3g / 2560MiB).
      GOMEMLIMIT: "7000MiB"
      INFLUXD_STORAGE_CACHE_MAX_MEMORY_SIZE: "134217728"
      INFLUXD_STORAGE_CACHE_SNAPSHOT_MEMORY_SIZE: "16777216"
      INFLUXD_STORAGE_MAX_CONCURRENT_COMPACTIONS: "1"
      INFLUXD_STORAGE_SERIES_ID_SET_CACHE_SIZE: "0"
      INFLUXD_QUERY_CONCURRENCY: "1"
      INFLUXD_QUERY_QUEUE_SIZE: "2"
    mem_limit: 8g
    cpus: 1.0
    volumes: !override
      - ${SFP_DATA_ROOT:-/workspace/sfp-data}/influx:/var/lib/influxdb2
      - ${SFP_DATA_ROOT:-/workspace/sfp-data}/influx-config:/etc/influxdb2

  ruoyi-mysql:
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --skip-character-set-client-handshake=1
      --max-connections=80
      --innodb-buffer-pool-size=192M
      --innodb-log-buffer-size=8M
      --table-open-cache=256
    mem_limit: 512m
    volumes: !override
      - ${SFP_DATA_ROOT:-/workspace/sfp-data}/mysql:/var/lib/mysql
      - ./ruoyi-fastapi-backend/sql/ruoyi-fastapi.sql:/docker-entrypoint-initdb.d/01-ruoyi-fastapi.sql
      - ./ruoyi-fastapi-backend/sql/sentiment-menu.sql:/docker-entrypoint-initdb.d/02-sentiment-menu.sql
      - ./ruoyi-fastapi-backend/sql/market-menu.sql:/docker-entrypoint-initdb.d/03-market-menu.sql
      - ./ruoyi-fastapi-backend/sql/quant-menu.sql:/docker-entrypoint-initdb.d/04-quant-menu.sql
      - ./ruoyi-fastapi-backend/sql/auto-trade.sql:/docker-entrypoint-initdb.d/05-auto-trade.sql
      - ./ruoyi-fastapi-backend/sql/full-feature-menu.sql:/docker-entrypoint-initdb.d/06-full-feature-menu.sql
      - ./ruoyi-fastapi-backend/sql/deep-feature-menu.sql:/docker-entrypoint-initdb.d/07-deep-feature-menu.sql
      - ./ruoyi-fastapi-backend/sql/risk-event-workflow.sql:/docker-entrypoint-initdb.d/09-risk-event-workflow.sql
      - ./ruoyi-fastapi-backend/sql/quant-phase2-snapshots.sql:/docker-entrypoint-initdb.d/10-quant-phase2-snapshots.sql
      - ./ruoyi-fastapi-backend/sql/quant-factor-qc.sql:/docker-entrypoint-initdb.d/11-quant-factor-qc.sql
      - ./ruoyi-fastapi-backend/sql/market-watchlist.sql:/docker-entrypoint-initdb.d/12-market-watchlist.sql
      - ./ruoyi-fastapi-backend/sql/web-polish.sql:/docker-entrypoint-initdb.d/13-web-polish.sql
      - ./ruoyi-fastapi-backend/sql/analysis-scheduler.sql:/docker-entrypoint-initdb.d/14-analysis-scheduler.sql
      - ./ruoyi-fastapi-backend/sql/quant-longbridge-user.sql:/docker-entrypoint-initdb.d/15-quant-longbridge-user.sql
      - ./ruoyi-fastapi-backend/sql/ai-requirement-board.sql:/docker-entrypoint-initdb.d/16-ai-requirement-board.sql
      - ./ruoyi-fastapi-backend/sql/ai-req-bots.sql:/docker-entrypoint-initdb.d/17-ai-req-bots.sql
      - ./ruoyi-fastapi-backend/sql/quant-daily-list.sql:/docker-entrypoint-initdb.d/18-quant-daily-list.sql
      - ./ruoyi-fastapi-backend/sql/plat-feishu-push.sql:/docker-entrypoint-initdb.d/19-plat-feishu-push.sql

  ruoyi-redis:
    mem_limit: 128m
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:-}",
        "--appendonly",
        "yes",
        "--maxmemory",
        "256mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes: !override
      - ${SFP_DATA_ROOT:-/workspace/sfp-data}/redis:/data

  sentiment-frontend:
    mem_limit: 64m
    volumes:
      - ./ruoyi-fastapi-frontend/bin/nginx.dockersentiment.slim.conf:/etc/nginx/conf.d/default.conf
    depends_on: !override
      sentiment-backend:
        condition: service_healthy
      sentiment-trade:
        condition: service_healthy
      sentiment-data:
        condition: service_healthy
      sentiment-intel:
        condition: service_healthy
