# Slim overlay for 15–16 GiB hosts (~4–6 GiB steady-state RSS, no swap preferred).
#
# Full stack (6 API + 4 job processes, higher headroom):
#   docker compose -f docker-compose.sentiment.yml up -d --build
#
# Slim stack (4 API + 1 job worker, same routes/features):
#   docker compose -f docker-compose.sentiment.yml -f docker-compose.sentiment.slim.yml up -d --build
#
# Optional bind-mount data dirs (do not bind-mount repo into nginx):
#   export SFP_DATA_ROOT=/var/lib/sfp
#   mkdir -p "$SFP_DATA_ROOT"/{mysql,redis,influx}
#   then uncomment the volume overrides at the bottom of this file.
#
# Verify memory after steady state (Influx healthy, ~5 min idle):
#   docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.MemPerc}}'
#
# Migrating full → slim: use the dual-file command above; profiles disable split
# API/worker containers. Trade stays isolated; LLM/采集与交易不同进程。

x-slim-pool-env: &slim-pool-env
  DB_POOL_SIZE: "6"
  DB_MAX_OVERFLOW: "2"

x-slim-api-health: &slim-api-health
  test:
    [
      "CMD",
      "python",
      "-c",
      "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/health', timeout=3)",
    ]
  interval: 15s
  timeout: 5s
  retries: 8
  start_period: 25s

services:
  # --- disable full-split API / worker containers when slim overlay is active ---
  sentiment-market:
    profiles: [full-split]
  sentiment-quant:
    profiles: [full-split]
  sentiment-news:
    profiles: [full-split]
  sentiment-ai:
    profiles: [full-split]
  sentiment-jobs-market:
    profiles: [full-split]
  sentiment-jobs-quant:
    profiles: [full-split]
  sentiment-jobs-llm:
    profiles: [full-split]

  # --- merged API: market + quant (Influx reads, WS) ---
  sentiment-data:
    build:
      context: ./ruoyi-fastapi-backend
      dockerfile: Dockerfile.sentiment
    image: sentiment-backend:latest
    container_name: sentiment-data
    volumes:
      - ./ruoyi-fastapi-backend/.env.dockersentiment:/app/.env.dockersentiment:ro
    networks:
      - sentiment-network
    restart: unless-stopped
    environment:
      <<: *slim-pool-env
      APP_ROLE: api
      APP_MODULE: data
      APP_JOB_GROUP: none
      APP_NAME: "Data API (market+quant)"
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      ruoyi-mysql:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
      sentiment-influxdb:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    healthcheck: *slim-api-health

  # --- merged API: sentiment + ai (舆情 / 选股 / open) ---
  sentiment-intel:
    build:
      context: ./ruoyi-fastapi-backend
      dockerfile: Dockerfile.sentiment
    image: sentiment-backend:latest
    container_name: sentiment-intel
    volumes:
      - ./ruoyi-fastapi-backend/.env.dockersentiment:/app/.env.dockersentiment:ro
    networks:
      - sentiment-network
    restart: unless-stopped
    environment:
      <<: *slim-pool-env
      APP_ROLE: api
      APP_MODULE: intel
      APP_JOB_GROUP: none
      APP_NAME: "Intel API (sentiment+ai)"
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      ruoyi-mysql:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
    mem_limit: 768m
    cpus: 1.0
    healthcheck: *slim-api-health

  # --- platform / trade: tighter caps, still isolated ---
  sentiment-backend:
    environment:
      <<: *slim-pool-env
    mem_limit: 512m

  sentiment-trade:
    environment:
      <<: *slim-pool-env
    mem_limit: 768m

  # --- scheduler + all queue groups in one worker (APP_JOB_GROUP=all) ---
  sentiment-jobs:
    environment:
      <<: *slim-pool-env
      APP_ROLE: scheduler
      APP_JOB_GROUP: all
      APP_NAME: "Sentiment Jobs (slim)"
    mem_limit: 1536m
    cpus: 1.5

  # --- data layer tuning ---
  sentiment-influxdb:
    environment:
      # Steady-state RSS ~1.5–2.2 GiB with cache caps below. Cold TSI open may spike;
      # if OOM during first boot after large restore, temporarily raise mem_limit to 5g.
      GOMEMLIMIT: "2.5GiB"
      INFLUXD_STORAGE_CACHE_MAX_MEMORY_SIZE: "268435456"
      INFLUXD_STORAGE_CACHE_SNAPSHOT_MEMORY_SIZE: "26214400"
    mem_limit: 3g
    cpus: 1.5

  ruoyi-mysql:
    # ~5 Python API/job 进程 × (pool 6 + overflow 2) ≈ 40；scheduler 双引擎峰值 ≈ 16
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_general_ci
      --skip-character-set-client-handshake=1
      --max-connections=120
      --innodb-buffer-pool-size=256M
      --innodb-log-buffer-size=16M
      --table-open-cache=400
    mem_limit: 768m

  ruoyi-redis:
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:-}",
        "--appendonly",
        "yes",
        "--maxmemory",
        "384mb",
        "--maxmemory-policy",
        "noeviction",
      ]

  sentiment-frontend:
    volumes:
      - ./ruoyi-fastapi-frontend/bin/nginx.dockersentiment.slim.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      sentiment-backend:
        condition: service_healthy
      sentiment-trade:
        condition: service_healthy
      sentiment-data:
        condition: service_healthy
      sentiment-intel:
        condition: service_healthy

