name: flutter-clients

on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths:
      - 'flutter_client/**'
      - '.github/workflows/flutter.yml'

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: flutter_client
        run: flutter pub get
      - name: Analyze
        working-directory: flutter_client
        run: flutter analyze --fatal-infos
      - name: Test
        working-directory: flutter_client
        run: flutter test

  # 可选正式签名：仓库 Secrets 配置 ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD /
  # ANDROID_KEY_ALIAS（缺省回退 debug 签名，仅内测可用）。
  build-android:
    name: android apk
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore release keystore
        working-directory: flutter_client/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > sff-upload.keystore
            cat > key.properties <<EOF
          storeFile=$PWD/sff-upload.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
          else
            echo '::warning::未配置签名密钥，APK 将使用 debug 签名'
          fi
      - name: Build APK
        working-directory: flutter_client
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sff-android-apk
          path: flutter_client/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-ios:
    name: ios (no codesign)
    runs-on: macos-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build iOS
        working-directory: flutter_client
        run: flutter build ios --release --no-codesign

  build-macos:
    name: macos app + dmg
    runs-on: macos-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build macOS
        working-directory: flutter_client
        run: flutter build macos --release
      - name: Package dmg and zip
        working-directory: flutter_client/build/macos/Build/Products/Release
        run: |
          hdiutil create -volname SmartFinancePlatform -srcfolder flutter_client.app -ov -format UDZO sff-macos.dmg
          zip -qry sff-macos.zip flutter_client.app
          mv sff-macos.dmg sff-macos.zip "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: sff-macos-dist
          path: |
            sff-macos.dmg
            sff-macos.zip
          if-no-files-found: error

  build-windows:
    name: windows exe
    runs-on: windows-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows
        working-directory: flutter_client
        run: flutter build windows --release
      - name: Zip bundle
        working-directory: flutter_client/build/windows/x64/runner/Release
        shell: pwsh
        run: Compress-Archive -Path * -DestinationPath "$GITHUB_WORKSPACE\sff-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: sff-windows-zip
          path: sff-windows.zip
          if-no-files-found: error

  # 打 v* 标签时把三平台产物发布到 GitHub Release。
  release:
    name: publish release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-ios, build-macos, build-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/app-release.apk
            dist/sff-macos.dmg
            dist/sff-macos.zip
            dist/sff-windows.zip
