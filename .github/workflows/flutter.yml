name: flutter-clients

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'flutter_client/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'flutter_client/**'
      - '.github/workflows/flutter.yml'

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: flutter_client
        run: flutter pub get
      - name: Analyze
        working-directory: flutter_client
        run: flutter analyze --fatal-infos
      - name: Test
        working-directory: flutter_client
        run: flutter test

  # 2026-08-25：android / ios / windows 原生壳已清空为占位目录，CI 只打 macOS。
  # 三端补回后把对应 job 从 git 历史里还原即可。
  build-macos:
    name: macos app + dmg
    runs-on: macos-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build macOS
        working-directory: flutter_client
        run: flutter build macos --release
      - name: Package dmg and zip
        working-directory: flutter_client/build/macos/Build/Products/Release
        run: |
          hdiutil create -volname SmartFinancePlatform -srcfolder flutter_client.app -ov -format UDZO sff-macos.dmg
          zip -qry sff-macos.zip flutter_client.app
          mv sff-macos.dmg sff-macos.zip "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@v4
        with:
          name: sff-macos-dist
          path: |
            sff-macos.dmg
            sff-macos.zip
          if-no-files-found: error

  release:
    name: publish release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-macos]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/sff-macos.dmg
            dist/sff-macos.zip
