name: flutter-clients

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'flutter_client/**'
      - '.github/workflows/flutter.yml'

concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Pub get
        working-directory: flutter_client
        run: flutter pub get
      - name: Analyze
        working-directory: flutter_client
        run: flutter analyze --fatal-infos
      - name: Test
        working-directory: flutter_client
        run: flutter test

  build-android:
    name: android apk
    runs-on: ubuntu-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build APK
        working-directory: flutter_client
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: sff-android-apk
          path: flutter_client/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: ios (no codesign)
    runs-on: macos-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build iOS
        working-directory: flutter_client
        run: flutter build ios --release --no-codesign

  build-macos:
    name: macos app
    runs-on: macos-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build macOS
        working-directory: flutter_client
        run: flutter build macos --release
      - name: Zip app
        working-directory: flutter_client
        run: cd build/macos/Build/Products/Release && zip -qry sff-macos.zip flutter_client.app && mv sff-macos.zip "$GITHUB_WORKSPACE"
        with:
          name: sff-macos-zip
          path: sff-macos.zip

  build-windows:
    name: windows exe
    runs-on: windows-latest
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build Windows
        working-directory: flutter_client
        run: flutter build windows --release
      - name: Zip bundle
        working-directory: flutter_client
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath sff-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: sff-windows-zip
          path: sff-windows.zip
