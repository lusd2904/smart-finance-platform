name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-unit:
    name: Backend unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruoyi-fastapi-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ruoyi-fastapi-backend/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio
      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: pytest -q tests/test_*.py

  desktop-gateway:
    name: Desktop gateway probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Normalize URL unit checks
        run: |
          node -e "
            const { normalizeGateway } = require('./desktop/src/gateway.js');
            if (normalizeGateway('127.0.0.1:12580') !== 'http://127.0.0.1:12580') process.exit(1);
            if (normalizeGateway('https://fin.example.com/login') !== 'https://fin.example.com') process.exit(1);
            try { normalizeGateway('file:///tmp'); process.exit(1); } catch (e) {}
            console.log('gateway normalize ok');
          "
