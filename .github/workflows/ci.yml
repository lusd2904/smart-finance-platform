name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  frontend-build:
    name: Frontend build & lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ruoyi-fastapi-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # package-lock.json 已入库；CI 与 Docker 前端镜像均依赖可复现安装
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts
      # 棘轮式 lint：存量 137 个历史错误（no-unused-vars 等待逐步清理）记录在
      # LINT_ERROR_BUDGET，本次改动不允许新增；低于预算同样失败提示清理。
      - name: Lint (error budget ratchet)
        run: |
          COUNT=$(npx eslint src --ext .js,.vue --format json | node -e "
            let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{
              const rows=JSON.parse(d);let e=0;
              for(const r of rows)for(const m of r.messages)if(m.severity===2)e++;
              console.log(e);
            });")
          BUDGET=137
          echo "eslint errors=$COUNT budget=$BUDGET"
          if [ "$COUNT" -gt "$BUDGET" ]; then
            echo "::error::ESLint 错误数 $COUNT 超出预算 $BUDGET，请修复新增错误"
            exit 1
          fi
      - name: Build production bundle
        run: npm run build:prod

  market-read:
    name: Go market-read tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/market-read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/market-read/go.sum
      - name: Test and build
        run: |
          go test ./...
          go build -o /tmp/market-read ./cmd/market-read

  sfp-intel:
    name: Go sfp-intel tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sfp-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/sfp-intel/go.sum
      - name: Test and build
        run: |
          go test ./...
          go build -o /tmp/sfp-intel ./cmd/sfp-intel

  data-api:
    name: Go data-api tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/data-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/data-api/go.sum
      - name: Test and build
        run: |
          go test ./...
          go build -o /tmp/data-api ./cmd/data-api

  market-worker:
    name: Go market-worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/market-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: workers/market-worker/go.sum
      - name: Test and build
        run: |
          go test ./...
          go build -o /tmp/market-worker ./cmd/market-worker

  quant-worker:
    name: Go quant-worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/quant-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: workers/quant-worker/go.sum
      - name: Test and build
        run: |
          go test ./...
          go build -o /tmp/quant-worker ./cmd/quant-worker

  trade-exec:
    name: Go trade-exec tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/trade-exec
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/trade-exec/go.sum
      - name: Test
        run: go test ./...

  trade-api:
    name: Go trade-api tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/trade-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/trade-api/go.sum
      - name: Test and build
        run: |
          go test ./...
          go build -o /tmp/trade-api ./cmd/trade-api

  notify-worker:
    name: Go notify-worker tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/notify-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Test and build
        run: |
          go mod tidy
          go test ./...
          go build -o /tmp/notify-worker ./cmd/notify-worker

  sfp-scheduler:
    name: Go sfp-scheduler tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sfp-scheduler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/sfp-scheduler/go.sum
      - name: Test and build
        run: |
          go test ./...
          go build -o /tmp/sfp-scheduler ./cmd/sfp-scheduler

  sfp-backend:
    name: Go sfp-backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sfp-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: services/sfp-backend/go.sum
      - name: Test and build
        run: |
          go test ./...
          go build -o /tmp/sfp-backend ./cmd/sfp-backend

  image-build:
    name: Docker image build & smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify frontend lockfile is committed
        run: |
          if [ ! -f ruoyi-fastapi-frontend/package-lock.json ]; then
            echo "::error::ruoyi-fastapi-frontend/package-lock.json 未入库，无法保证 npm ci 可复现构建"
            exit 1
          fi
      - name: Assert Python runtime trees are gone
        run: |
          if [ -d ruoyi-fastapi-backend ] || [ -d ruoyi-fastapi-test ]; then
            echo "::error::Python RuoYi trees must stay off main"
            exit 1
          fi
          if ls docker-compose*python* >/dev/null 2>&1; then
            echo "::error::Python fallback compose overlays must stay off main"
            ls docker-compose*python*
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Build market-worker image
        uses: docker/build-push-action@v6
        with:
          context: workers/market-worker
          file: workers/market-worker/Dockerfile
          load: true
          tags: sfp-market-worker:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build sfp-scheduler image
        uses: docker/build-push-action@v6
        with:
          context: services/sfp-scheduler
          file: services/sfp-scheduler/Dockerfile
          load: true
          tags: sfp-scheduler:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ruoyi-fastapi-frontend
          file: ruoyi-fastapi-frontend/Dockerfile
          load: true
          tags: smart-finance-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test frontend image
        run: |
          docker run -d --name smoke-frontend -p 8080:8080 smart-finance-frontend:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8080/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/ | grep -qi '<!DOCTYPE html\|<html' \
            || { echo "::error::前端镜像未返回有效 HTML 首页"; docker logs smoke-frontend; exit 1; }
          docker rm -f smoke-frontend >/dev/null
      - name: Prepare docker compose env for CI
        run: |
          cp .env.dockersentiment.example .env.dockersentiment
          {
            echo 'MYSQL_ROOT_PASSWORD=ci'
            echo 'REDIS_PASSWORD=ci'
            echo 'INFLUXDB_PASSWORD=ci'
            echo 'INFLUXDB_TOKEN=ci'
            echo 'INTERNAL_JOB_TOKEN=ci-internal'
            echo 'INITIAL_ADMIN_PASSWORD=ci-admin'
          } > .env
      - name: Validate slim compose config
        run: |
          export MYSQL_ROOT_PASSWORD=ci REDIS_PASSWORD=ci INFLUXDB_PASSWORD=ci INFLUXDB_TOKEN=ci \
            INTERNAL_JOB_TOKEN=ci
          SLIM=(docker compose -f docker-compose.sentiment.yml -f docker-compose.sentiment.slim.yml)
          "${SLIM[@]}" config >/dev/null
          "${SLIM[@]}" -f docker-compose.sentiment.slim.influx-phase.yml config >/dev/null
          "${SLIM[@]}" -f docker-compose.sentiment.slim.influx-steady.yml config >/dev/null
          echo "slim compose config ok"
      - name: Assert default slim is Go-only
        run: |
          export MYSQL_ROOT_PASSWORD=ci REDIS_PASSWORD=ci INFLUXDB_PASSWORD=ci INFLUXDB_TOKEN=ci \
            INTERNAL_JOB_TOKEN=ci
          if grep -E 'proxy_pass[[:space:]]+http://sentiment-(backend|data|trade|intel)[:/]' \
            ruoyi-fastapi-frontend/bin/nginx.dockersentiment.slim.conf \
            ruoyi-fastapi-frontend/bin/nginx.dockersentiment.conf; then
            echo "::error::nginx has a deleted Python fat upstream"
            exit 1
          fi
          docker compose \
            -f docker-compose.sentiment.yml \
            -f docker-compose.sentiment.slim.yml \
            config --format json | python3 -c '
          import json, sys
          cfg = json.load(sys.stdin)
          fats = {
              "sentiment-backend", "sentiment-data", "sentiment-intel",
              "sentiment-trade", "sentiment-jobs",
          }
          started = []
          for name, svc in (cfg.get("services") or {}).items():
              if not (svc.get("profiles") or []):
                  started.append(name)
          bad = sorted(fats & set(started))
          print("default slim services:", ", ".join(sorted(started)))
          if bad:
              print("ERROR: Python fat containers would start:", ", ".join(bad), file=sys.stderr)
              sys.exit(1)
          if fats & set(cfg.get("services") or {}):
              print("ERROR: Python fat service definitions still present", file=sys.stderr)
              sys.exit(1)
          print("ok: no Python fat containers in compose")
          '
