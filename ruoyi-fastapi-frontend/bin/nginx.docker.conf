# 镜像内置默认 server 配置（非特权 nginx 统一监听 8080）
# 说明：docker-compose 各变体通过 volume 挂载 bin/nginx.docker*.conf 覆盖本文件，
# API 反向代理（/docker-api/、/prod-api/）由挂载的变体配置提供；
# 本文件不写静态 proxy_pass 上游，避免独立运行镜像时因上游域名不可解析导致 nginx 启动失败。
server {
    listen 8080;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
