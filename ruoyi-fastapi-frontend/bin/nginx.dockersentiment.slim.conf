# Slim stack nginx — Go-only. Normal paths have ZERO upstreams to
# sentiment-backend / sentiment-data / sentiment-trade / sentiment-intel.
#   热读 + 行情 WS/live quotes → sentiment-market-read
#   其余 /market/ + /quant/ → sentiment-data-api
#   sentiment + ai + /open/ → sfp-intel
#   平台登录/RBAC catch-all + ws/jobs + open/sync → sfp-backend
#   /trade/* → sentiment-trade-api
# Python fat containers are not started on default slim. Emergency rollback:
#   --profile legacy-python + overlay (intel/trade/platform/quant/scheduler).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name localhost;

    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    location /docker-api/ws/jobs {
        proxy_pass http://sfp-backend:9099/ws/jobs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /prod-api/ws/jobs {
        proxy_pass http://sfp-backend:9099/ws/jobs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /docker-api/ws/market/quotes {
        proxy_pass http://sentiment-market-read:8080/ws/market/quotes;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    location /prod-api/ws/market/quotes {
        proxy_pass http://sentiment-market-read:8080/ws/market/quotes;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # 无其它 /ws/ 业务路由（jobs → backend；quotes → market-read）。未知 WS 返回 404。

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 自动交易扫描含策略评估，可能超过 30s
    location /docker-api/trade/auto/run {
        proxy_pass http://sentiment-trade-api:8080/trade/auto/run;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    location /prod-api/trade/auto/run {
        proxy_pass http://sentiment-trade-api:8080/trade/auto/run;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # 交易门户：Go trade-api（全部 /trade/* 原生）。Python 回滚见 docker-compose.sentiment.trade-python-fallback.yml
    location /docker-api/trade/ {
        proxy_pass http://sentiment-trade-api:8080/trade/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
