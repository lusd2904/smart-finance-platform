# strategy_evaluate bridge to Python sentiment-data (auto_trade signals).
# Requires legacy-data profile so sentiment-data is running:
#
#   docker compose \
#     -f docker-compose.sentiment.yml \
#     -f docker-compose.sentiment.slim.yml \
#     -f docker-compose.sentiment.quant-python-fallback.yml \
#     --profile legacy-data up -d --build sfp-backend sentiment-data

services:
  sfp-backend:
    environment:
      STRATEGY_EVAL_URL: http://sentiment-data:9099
