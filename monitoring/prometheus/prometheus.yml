global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'smart-finance-backend'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'sfp-backend:9099'
          - 'sfp-intel:8080'
          - 'sentiment-trade-api:8080'
          - 'sentiment-data-api:8081'
          - 'sentiment-market-read:8080'
          - 'host.docker.internal:19099'

  - job_name: 'smart-finance-jobs'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'sfp-scheduler:9098'
          - 'sfp-market-worker:9098'
          - 'sfp-quant-worker:9097'
          - 'sfp-notify-worker:9096'
          - 'host.docker.internal:19098'
