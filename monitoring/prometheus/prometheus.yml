global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'smart-finance-backend'
    metrics_path: '/metrics'
    static_configs:
      # docker-compose.sentiment.yml 容器内端口 9099
      - targets: ['sentiment-backend:9099']
      # 本机直接跑后端时
      - targets: ['host.docker.internal:19099']
