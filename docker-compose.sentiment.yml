# 监控栈（Prometheus/Grafana）另起：
#   docker compose -f docker-compose.monitor.yml up -d
#
# 禁止 compose down 整栈。新增/更新服务：
#   docker compose -f docker-compose.sentiment.yml up -d --no-deps --build <service>
x-backend-image: &backend-image
  build:
    context: ./ruoyi-fastapi-backend
    dockerfile: Dockerfile.sentiment
  image: sentiment-backend:latest
  volumes:
    - ./ruoyi-fastapi-backend/.env.dockersentiment:/app/.env.dockersentiment:ro
  networks:
    - sentiment-network
  restart: unless-stopped

x-backend-depends: &backend-depends
  ruoyi-mysql:
    condition: service_healthy
  ruoyi-redis:
    condition: service_healthy
  sentiment-influxdb:
    condition: service_healthy

services:
  # 前端服务
  sentiment-frontend:
    build:
      context: ./ruoyi-fastapi-frontend
      dockerfile: Dockerfile
    image: sentiment-frontend:latest
    container_name: sentiment-frontend
    restart: unless-stopped
    ports:
      - "12580:80"
    volumes:
      - ./ruoyi-fastapi-frontend/bin/nginx.dockersentiment.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - sentiment-backend
      - sentiment-trade
      - sentiment-market
      - sentiment-quant
      - sentiment-news
      - sentiment-ai
    networks:
      - sentiment-network

  # 平台 API：登录/系统/任务中心。APP_MODULE=all 作为网关回退。
  sentiment-backend:
    <<: *backend-image
    container_name: sentiment-backend
    ports:
      - "19099:9099"
    environment:
      APP_ROLE: api
      APP_MODULE: all
      APP_JOB_GROUP: none
    depends_on: *backend-depends
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9099/health', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

  # 交易实时 API：低延迟，禁止和 LLM/采集共进程
  sentiment-trade:
    <<: *backend-image
    container_name: sentiment-trade
    environment:
      APP_ROLE: api
      APP_MODULE: trade
      APP_JOB_GROUP: none
      APP_NAME: "Trade API"
    depends_on: *backend-depends
    mem_limit: 1g
    cpus: 1.0

  sentiment-market:
    <<: *backend-image
    container_name: sentiment-market
    environment:
      APP_ROLE: api
      APP_MODULE: market
      APP_JOB_GROUP: none
      APP_NAME: "Market API"
    depends_on: *backend-depends
    mem_limit: 1g
    cpus: 1.0

  sentiment-quant:
    <<: *backend-image
    container_name: sentiment-quant
    environment:
      APP_ROLE: api
      APP_MODULE: quant
      APP_JOB_GROUP: none
      APP_NAME: "Quant API"
    depends_on: *backend-depends
    mem_limit: 1g
    cpus: 1.0

  sentiment-news:
    <<: *backend-image
    container_name: sentiment-news
    environment:
      APP_ROLE: api
      APP_MODULE: sentiment
      APP_JOB_GROUP: none
      APP_NAME: "Sentiment API"
    depends_on: *backend-depends
    mem_limit: 1g
    cpus: 1.0

  sentiment-ai:
    <<: *backend-image
    container_name: sentiment-ai
    environment:
      APP_ROLE: api
      APP_MODULE: ai
      APP_JOB_GROUP: none
      APP_NAME: "AI API"
    depends_on: *backend-depends
    mem_limit: 1g
    cpus: 1.0

  # 独立 jobs：只跑 APScheduler，不消费队列
  sentiment-jobs:
    <<: *backend-image
    container_name: sentiment-jobs
    command: ["python", "scheduler_app.py", "--env=dockersentiment"]
    ports:
      - "19098:9098"
    environment:
      APP_ROLE: scheduler
      APP_JOB_GROUP: none
      APP_PORT: "9098"
      APP_NAME: "Sentiment Jobs"
      APP_ROOT_PATH: ""
      APP_WORKERS: "1"
      APP_RELOAD: "false"
    depends_on: *backend-depends
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9098/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # 行情采集消费组
  sentiment-jobs-market:
    <<: *backend-image
    container_name: sentiment-jobs-market
    command: ["python", "scheduler_app.py", "--env=dockersentiment"]
    environment:
      APP_ROLE: worker
      APP_JOB_GROUP: market
      APP_PORT: "9098"
      APP_NAME: "Jobs Market"
      APP_ROOT_PATH: ""
      APP_WORKERS: "1"
      APP_RELOAD: "false"
    depends_on: *backend-depends
    mem_limit: 1536m
    cpus: 1.0

  # 量化计算消费组
  sentiment-jobs-quant:
    <<: *backend-image
    container_name: sentiment-jobs-quant
    command: ["python", "scheduler_app.py", "--env=dockersentiment"]
    environment:
      APP_ROLE: worker
      APP_JOB_GROUP: quant
      APP_PORT: "9098"
      APP_NAME: "Jobs Quant"
      APP_ROOT_PATH: ""
      APP_WORKERS: "1"
      APP_RELOAD: "false"
    depends_on: *backend-depends
    mem_limit: 1536m
    cpus: 1.0

  # 舆情与 LLM 消费组
  sentiment-jobs-llm:
    <<: *backend-image
    container_name: sentiment-jobs-llm
    command: ["python", "scheduler_app.py", "--env=dockersentiment"]
    environment:
      APP_ROLE: worker
      APP_JOB_GROUP: llm
      APP_PORT: "9098"
      APP_NAME: "Jobs LLM"
      APP_ROOT_PATH: ""
      APP_WORKERS: "1"
      APP_RELOAD: "false"
    depends_on: *backend-depends
    mem_limit: 1536m
    cpus: 1.0

  # InfluxDB时序库服务（行情/量化数据）
  sentiment-influxdb:
    image: influxdb:2.7
    container_name: sentiment-influxdb
    restart: unless-stopped
    ports:
      - "18086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: CHANGE_ME_DB_PASSWORD
      DOCKER_INFLUXDB_INIT_ORG: longbridge
      DOCKER_INFLUXDB_INIT_BUCKET: market_us
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: CHANGE_ME_INFLUX_TOKEN
    volumes:
      - sentiment-influxdb-data:/var/lib/influxdb2
      - sentiment-influxdb-config:/etc/influxdb2
    networks:
      - sentiment-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

  # MySQL服务
  ruoyi-mysql:
    image: mysql:8.0
    container_name: sentiment-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: CHANGE_ME_DB_PASSWORD
      MYSQL_DATABASE: sentiment-ai
    ports:
      - "13306:3306"
    volumes:
      - sentiment-mysql-data:/var/lib/mysql
      - ./ruoyi-fastapi-backend/sql/ruoyi-fastapi.sql:/docker-entrypoint-initdb.d/01-ruoyi-fastapi.sql
      - ./ruoyi-fastapi-backend/sql/sentiment-menu.sql:/docker-entrypoint-initdb.d/02-sentiment-menu.sql
      - ./ruoyi-fastapi-backend/sql/market-menu.sql:/docker-entrypoint-initdb.d/03-market-menu.sql
      - ./ruoyi-fastapi-backend/sql/quant-menu.sql:/docker-entrypoint-initdb.d/04-quant-menu.sql
      - ./ruoyi-fastapi-backend/sql/auto-trade.sql:/docker-entrypoint-initdb.d/05-auto-trade.sql
      - ./ruoyi-fastapi-backend/sql/full-feature-menu.sql:/docker-entrypoint-initdb.d/06-full-feature-menu.sql
      - ./ruoyi-fastapi-backend/sql/deep-feature-menu.sql:/docker-entrypoint-initdb.d/07-deep-feature-menu.sql
      - ./ruoyi-fastapi-test/disable_captcha.sql:/docker-entrypoint-initdb.d/08-disable-captcha.sql
      - ./ruoyi-fastapi-backend/sql/risk-event-workflow.sql:/docker-entrypoint-initdb.d/09-risk-event-workflow.sql
      - ./ruoyi-fastapi-backend/sql/quant-phase2-snapshots.sql:/docker-entrypoint-initdb.d/10-quant-phase2-snapshots.sql
      - ./ruoyi-fastapi-backend/sql/quant-factor-qc.sql:/docker-entrypoint-initdb.d/11-quant-factor-qc.sql
      - ./ruoyi-fastapi-backend/sql/market-watchlist.sql:/docker-entrypoint-initdb.d/12-market-watchlist.sql
      - ./ruoyi-fastapi-backend/sql/web-polish.sql:/docker-entrypoint-initdb.d/13-web-polish.sql
      - ./ruoyi-fastapi-backend/sql/analysis-scheduler.sql:/docker-entrypoint-initdb.d/14-analysis-scheduler.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --skip-character-set-client-handshake=1
    networks:
      - sentiment-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pCHANGE_ME_DB_PASSWORD"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Redis服务
  ruoyi-redis:
    image: redis:latest
    container_name: sentiment-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    networks:
      - sentiment-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

volumes:
  sentiment-mysql-data:
  sentiment-influxdb-data:
  sentiment-influxdb-config:

# 网络配置
networks:
  sentiment-network:
    name: sentiment-network
    driver: bridge
