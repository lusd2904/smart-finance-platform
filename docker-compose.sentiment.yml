# 监控栈（Prometheus/Grafana）另起：
#   docker compose -f docker-compose.monitor.yml up -d
#
# 内存：16 GiB 及以下云主机用 slim 叠加层（见 docker-compose.sentiment.slim.yml）。
# 生产路径为 Go-only（sfp-backend / sfp-intel / data-api / trade-api / market-read / workers / scheduler）。
# Python RuoYi-FastAPI 后端已从 main 删除，回滚见 docs/PYTHON-REMOVED.md。
#
# 禁止 compose down 整栈。新增/更新服务：
#   docker compose -f docker-compose.sentiment.yml up -d --no-deps --build <service>

# 登录/系统/AI/交易 HTTP 只等 MySQL+Redis。Influx 冷启动可达 10 分钟，不能挡住登录。
x-core-depends: &core-depends
  sentiment-mysql:
    condition: service_healthy
  ruoyi-redis:
    condition: service_healthy

# 行情/量化读时序库，等 Influx healthy 再接流量。
x-data-depends: &data-depends
  sentiment-mysql:
    condition: service_healthy
  ruoyi-redis:
    condition: service_healthy
  sentiment-influxdb:
    condition: service_healthy

services:
  sentiment-frontend:
    build:
      context: ./ruoyi-fastapi-frontend
      dockerfile: Dockerfile
    image: sentiment-frontend:latest
    container_name: sentiment-frontend
    restart: unless-stopped
    ports:
      - "12580:8080"
    volumes:
      - ./ruoyi-fastapi-frontend/bin/nginx.dockersentiment.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      sfp-backend:
        condition: service_healthy
      sfp-intel:
        condition: service_healthy
      sentiment-market-read:
        condition: service_healthy
      sentiment-trade-api:
        condition: service_healthy
      sentiment-data-api:
        condition: service_healthy
      # market/quant 等 Influx，冷启动可达 10 分钟；登录页不能跟着等。
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - sentiment-network

  # Go platform API：登录 / getInfo / getRouters / system RBAC / dashboard / ws/jobs
  sfp-backend:
    build:
      context: ./services/sfp-backend
      dockerfile: Dockerfile
    image: sfp-backend:latest
    container_name: sfp-backend
    env_file:
      - ./.env.dockersentiment
    environment:
      LISTEN_ADDR: ":9099"
      DB_HOST: sentiment-mysql
      REDIS_HOST: ruoyi-redis
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      INTERNAL_JOB_TOKEN: ${INTERNAL_JOB_TOKEN:?请在 .env 中设置 INTERNAL_JOB_TOKEN}
      INFLUX_TOKEN: ${INFLUXDB_TOKEN}
      INFLUX_ORG: longbridge
      INFLUX_BUCKET_US: market_us
      INFLUX_BUCKET_CN: market_data
      INTEL_JOBS_URL: ""
      STRATEGY_EVAL_URL: ""
    depends_on: *core-depends
    mem_limit: 128m
    cpus: 0.25
    networks:
      - sentiment-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9099/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  # Go intel API：/sentiment/ /ai/ /open/
  sfp-intel:
    build:
      context: ./services/sfp-intel
      dockerfile: Dockerfile
    image: sfp-intel:latest
    container_name: sfp-intel
    env_file:
      - ./.env.dockersentiment
    environment:
      LISTEN_ADDR: ":8080"
      DB_HOST: sentiment-mysql
      REDIS_HOST: ruoyi-redis
      INTERNAL_JOB_TOKEN: ${INTERNAL_JOB_TOKEN:?请在 .env 中设置 INTERNAL_JOB_TOKEN}
    depends_on: *core-depends
    mem_limit: 320m
    cpus: 0.5
    networks:
      - sentiment-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  # 行情只读热路径 + 行情 WS / live quotes。
  sentiment-market-read:
    build:
      context: ./services/market-read
      dockerfile: Dockerfile
    image: sentiment-market-read:latest
    container_name: sentiment-market-read
    env_file:
      - ./.env.dockersentiment
    environment:
      LISTEN_ADDR: ":8080"
      DB_HOST: sentiment-mysql
      REDIS_HOST: ruoyi-redis
      INFLUX_URL: http://sentiment-influxdb:8086
    depends_on: *data-depends
    mem_limit: 320m
    cpus: 0.5
    networks:
      - sentiment-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  # 交易门户 HTTP（Go）：全部 /trade/* 原生；strategy_evaluate 经 sfp-backend internal jobs
  sentiment-trade-api:
    build:
      context: .
      dockerfile: services/trade-api/Dockerfile
    image: sentiment-trade-api:latest
    container_name: sentiment-trade-api
    env_file:
      - ./.env.dockersentiment
    environment:
      LISTEN_ADDR: ":8080"
      DB_HOST: sentiment-mysql
      REDIS_HOST: ruoyi-redis
      INFLUX_URL: http://sentiment-influxdb:8086
      INFLUX_TOKEN: ${INFLUXDB_TOKEN}
      INFLUX_ORG: longbridge
      INFLUX_BUCKET_US: market_us
      INFLUX_BUCKET_CN: market_data
      INTERNAL_JOBS_URL: http://sfp-backend:9099/internal/jobs/run
      INTERNAL_JOB_TOKEN: ${INTERNAL_JOB_TOKEN:?请在 .env 中设置 INTERNAL_JOB_TOKEN}
    depends_on: *data-depends
    mem_limit: 384m
    cpus: 0.5
    networks:
      - sentiment-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  # 剩余 /market/ + /quant/ HTTP（非热读）。
  sentiment-data-api:
    build:
      context: .
      dockerfile: services/data-api/Dockerfile
    image: sentiment-data-api:latest
    container_name: sentiment-data-api
    env_file:
      - ./.env.dockersentiment
    environment:
      LISTEN_ADDR: ":8081"
      DB_HOST: sentiment-mysql
      REDIS_HOST: ruoyi-redis
      INFLUX_URL: http://sentiment-influxdb:8086
    depends_on: *data-depends
    mem_limit: 256m
    cpus: 0.5
    networks:
      - sentiment-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  # Go scheduler: load sys_job + cron, enqueue Redis DB 2 payloads.
  sfp-scheduler:
    build:
      context: ./services/sfp-scheduler
      dockerfile: Dockerfile
    image: sfp-scheduler:latest
    container_name: sfp-scheduler
    ports:
      - "127.0.0.1:19098:9098"
    environment:
      SCHEDULER_PORT: "9098"
      # Existing sys_job hours were authored as container UTC (Python APScheduler
      # used process-local TZ). Pin UTC so fire times stay identical. Binary
      # default is Asia/Shanghai when SCHEDULER_TZ is unset.
      TZ: UTC
      SCHEDULER_TZ: UTC
      REDIS_HOST: ruoyi-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: "2"
      DB_HOST: sentiment-mysql
      DB_PORT: "3306"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_DATABASE: sentiment-ai
    depends_on: *core-depends
    networks:
      - sentiment-network
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9098/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # 行情队列消费：Go worker（K 线 / 简报 / 看板 / 代码表 / 热度 / 标的内容）
  sfp-market-worker:
    build:
      context: ./workers/market-worker
      dockerfile: Dockerfile
    image: sfp-market-worker:latest
    container_name: sfp-market-worker
    ports:
      - "127.0.0.1:19097:9098"
    environment:
      WORKER_PORT: "9098"
      REDIS_HOST: ruoyi-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: "2"
      DB_HOST: sentiment-mysql
      DB_PORT: "3306"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_DATABASE: sentiment-ai
      INFLUX_URL: http://sentiment-influxdb:8086
      INFLUX_TOKEN: ${INFLUXDB_TOKEN}
      INFLUX_ORG: longbridge
      INFLUX_BUCKET_US: market_us
      INFLUX_BUCKET_CN: market_data
      LONGPORT_APP_KEY: ${LONGPORT_APP_KEY:-}
      LONGPORT_APP_SECRET: ${LONGPORT_APP_SECRET:-}
      LONGPORT_ACCESS_TOKEN: ${LONGPORT_ACCESS_TOKEN:-}
      LONGPORT_REGION: ${LONGPORT_REGION:-cn}
      KLINE_SYMBOL_INTERVAL: "0.4"
      JOB_VISIBILITY_TIMEOUT_S: "900"
      JOB_MAX_RETRIES: "3"
    depends_on: *data-depends
    networks:
      - sentiment-network
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9098/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 25s

  # quant 队列：Go worker（因子/策略/清单扫描 + Longbridge 开仓/auto_trade/止损卖出）
  sfp-quant-worker:
    build:
      context: ./workers/quant-worker
      dockerfile: Dockerfile
    image: sfp-quant-worker:latest
    container_name: sfp-quant-worker
    env_file:
      - ./.env.dockersentiment
    ports:
      - "127.0.0.1:19096:9097"
    environment:
      WORKER_PORT: "9097"
      REDIS_HOST: ruoyi-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: "2"
      DB_HOST: sentiment-mysql
      DB_PORT: "3306"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_DATABASE: sentiment-ai
      INFLUX_URL: http://sentiment-influxdb:8086
      INFLUX_TOKEN: ${INFLUXDB_TOKEN}
      INFLUX_ORG: longbridge
      INFLUX_BUCKET_US: market_us
      INFLUX_BUCKET_CN: market_data
      INTERNAL_JOB_TOKEN: ${INTERNAL_JOB_TOKEN}
      INTERNAL_JOBS_URL: http://sfp-backend:9099/internal/jobs/run
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      LONGPORT_APP_KEY: ${LONGPORT_APP_KEY:-}
      LONGPORT_APP_SECRET: ${LONGPORT_APP_SECRET:-}
      LONGPORT_ACCESS_TOKEN: ${LONGPORT_ACCESS_TOKEN:-}
      LONGPORT_REGION: ${LONGPORT_REGION:-cn}
      JOB_VISIBILITY_TIMEOUT_S: "900"
      JOB_MAX_RETRIES: "3"
    depends_on: *data-depends
    networks:
      - sentiment-network
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9097/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 25s

  # llm 队列：Go worker（舆情分析 / 需求沟通 / 飞书推送原生）
  sfp-notify-worker:
    build:
      context: ./workers/notify-worker
      dockerfile: Dockerfile
    image: sfp-notify-worker:latest
    container_name: sfp-notify-worker
    ports:
      - "127.0.0.1:19095:9096"
    environment:
      WORKER_PORT: "9096"
      REDIS_HOST: ruoyi-redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: "2"
      DB_HOST: sentiment-mysql
      DB_PORT: "3306"
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_DATABASE: sentiment-ai
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      JOB_VISIBILITY_TIMEOUT_S: "900"
      JOB_MAX_RETRIES: "3"
    depends_on:
      sentiment-mysql:
        condition: service_healthy
      ruoyi-redis:
        condition: service_healthy
    networks:
      - sentiment-network
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://127.0.0.1:9096/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 25s

  sentiment-influxdb:
    image: influxdb:2.7
    container_name: sentiment-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:?请在 .env 中设置 INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: longbridge
      DOCKER_INFLUXDB_INIT_BUCKET: market_us
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:?请在 .env 中设置 INFLUXDB_TOKEN}
      GOMAXPROCS: "1"
      GOMEMLIMIT: "5GiB"
      INFLUXD_STORAGE_CACHE_MAX_MEMORY_SIZE: "268435456"
      INFLUXD_STORAGE_CACHE_SNAPSHOT_MEMORY_SIZE: "26214400"
      INFLUXD_STORAGE_MAX_CONCURRENT_COMPACTIONS: "1"
      INFLUXD_STORAGE_SERIES_ID_SET_CACHE_SIZE: "0"
      INFLUXD_QUERY_CONCURRENCY: "2"
      INFLUXD_QUERY_QUEUE_SIZE: "4"
    mem_limit: 6g
    cpus: 2.0
    volumes:
      - sentiment-influxdb-data:/var/lib/influxdb2
      - sentiment-influxdb-config:/etc/influxdb2
    networks:
      - sentiment-network
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 10m

  sentiment-mysql:
    image: mysql:8.0
    container_name: sentiment-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 中设置 MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: sentiment-ai
    volumes:
      - sentiment-mysql-data:/var/lib/mysql
      - ./sql/ruoyi-fastapi.sql:/docker-entrypoint-initdb.d/01-ruoyi-fastapi.sql
      - ./sql/sentiment-menu.sql:/docker-entrypoint-initdb.d/02-sentiment-menu.sql
      - ./sql/market-menu.sql:/docker-entrypoint-initdb.d/03-market-menu.sql
      - ./sql/quant-menu.sql:/docker-entrypoint-initdb.d/04-quant-menu.sql
      - ./sql/auto-trade.sql:/docker-entrypoint-initdb.d/05-auto-trade.sql
      - ./sql/full-feature-menu.sql:/docker-entrypoint-initdb.d/06-full-feature-menu.sql
      - ./sql/deep-feature-menu.sql:/docker-entrypoint-initdb.d/07-deep-feature-menu.sql
      # 初始化脚本编号跳过 08（历史迁移已废弃），保留缺口以维持既有环境顺序
      - ./sql/risk-event-workflow.sql:/docker-entrypoint-initdb.d/09-risk-event-workflow.sql
      - ./sql/quant-phase2-snapshots.sql:/docker-entrypoint-initdb.d/10-quant-phase2-snapshots.sql
      - ./sql/quant-factor-qc.sql:/docker-entrypoint-initdb.d/11-quant-factor-qc.sql
      - ./sql/market-watchlist.sql:/docker-entrypoint-initdb.d/12-market-watchlist.sql
      - ./sql/web-polish.sql:/docker-entrypoint-initdb.d/13-web-polish.sql
      - ./sql/analysis-scheduler.sql:/docker-entrypoint-initdb.d/14-analysis-scheduler.sql
      - ./sql/quant-longbridge-user.sql:/docker-entrypoint-initdb.d/15-quant-longbridge-user.sql
      - ./sql/ai-requirement-board.sql:/docker-entrypoint-initdb.d/16-ai-requirement-board.sql
      - ./sql/ai-req-bots.sql:/docker-entrypoint-initdb.d/17-ai-req-bots.sql
      - ./sql/quant-daily-list.sql:/docker-entrypoint-initdb.d/18-quant-daily-list.sql
      - ./sql/plat-feishu-push.sql:/docker-entrypoint-initdb.d/19-plat-feishu-push.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci --skip-character-set-client-handshake=1 --max-connections=300
    networks:
      - sentiment-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 10s
      retries: 30

  ruoyi-redis:
    image: redis:7-alpine
    container_name: sentiment-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:-}",
        "--appendonly",
        "yes",
        "--maxmemory",
        "512mb",
        "--maxmemory-policy",
        "noeviction",
      ]
    volumes:
      - sentiment-redis-data:/data
    networks:
      - sentiment-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi | grep PONG",
        ]
      interval: 5s
      timeout: 10s
      retries: 30

  sfp-backup:
    image: docker:27-cli
    container_name: sentiment-backup
    restart: unless-stopped
    command: ["sh", "/scripts/backup_loop.sh"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      SKIP_CD: "1"
      BACKUP_DIR: /backups
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts:/scripts:ro
      - ./backups:/backups
    depends_on:
      sentiment-mysql:
        condition: service_healthy
      sentiment-influxdb:
        condition: service_healthy
    networks:
      - sentiment-network

volumes:
  sentiment-mysql-data:
  sentiment-influxdb-data:
  sentiment-influxdb-config:
  sentiment-redis-data:

networks:
  sentiment-network:
    name: sentiment-network
    driver: bridge
