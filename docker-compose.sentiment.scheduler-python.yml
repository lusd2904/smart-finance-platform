# Emergency rollback: applying this overlay starts Python sentiment-jobs and
# disables Go sfp-scheduler. Not used on default slim.
#
#   sudo docker compose \
#     -f docker-compose.sentiment.yml \
#     -f docker-compose.sentiment.slim.yml \
#     -f docker-compose.sentiment.scheduler-python.yml \
#     --profile legacy-python \
#     up -d --no-deps sentiment-jobs
#   sudo docker rm -f sfp-scheduler
#
# Stop Python and return to Go:
#   sudo docker compose -f docker-compose.sentiment.yml -f docker-compose.sentiment.slim.yml \
#     up -d --no-deps --build sfp-scheduler
#   sudo docker rm -f sentiment-jobs

services:
  sfp-scheduler:
    profiles: [go-scheduler]

  sentiment-jobs:
    profiles: !override []
